name: 冒烟测试

# 验证「陌生人 clone 下来能不能直接用」。
# 刻意不装 npm 依赖 —— 取用组件本来就不需要，这正是要守住的性质。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 注意：这里没有 npm install。取用路径必须零依赖可用，
      # 一旦哪天改坏了这个性质，这个 job 就会红。
      - name: 冒烟
        run: node scripts/ci-smoke.mjs

      # custom/ 下的自有组件必须一直满足入库标准，
      # 否则选型台的参数面板会退化、取用会带上外链
      - name: 自有组件入库标准
        run: node scripts/validate-component.mjs

  playground-build:
    name: 选型台能否构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: 检查产物
        run: |
          test -f playground/dist/index.html || { echo "构建产物缺失"; exit 1; }
          echo "产物大小：$(du -sh playground/dist | cut -f1)"
