name: 冒烟测试

# 两类工具，两种验证方式：
#   使用者的（add.mjs / doctor.mjs）必须零依赖可用 —— smoke job 刻意不装 npm 依赖
#   维护者的（validate / index-custom / build-prompts）要做 AST 解析，需要依赖
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 注意：这里没有 npm install，是故意的。
      # 取用路径零依赖可用是这个项目的核心承诺，
      # 谁哪天让 add.mjs 依赖上第三方包，这 12 个 job 立刻红。
      - name: 取用路径（零依赖）
        run: node scripts/ci-smoke.mjs

  standards:
    name: 自有组件入库标准
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # validate 要解析 TS 类型推参数表，需要 @babel/parser
      - run: npm ci --no-audit --no-fund
      - name: 校验 custom/ 下的组件
        run: node scripts/validate-component.mjs
      - name: 索引合并是幂等的
        run: |
          node scripts/index-custom.mjs
          node scripts/index-custom.mjs
          git diff --exit-code prompts/index.json prompts/props.json \
            || { echo "index-custom 不幂等：跑两次结果不一样"; exit 1; }

  playground-build:
    name: 选型台能否构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: 检查产物
        run: |
          test -f playground/dist/index.html || { echo "构建产物缺失"; exit 1; }
          echo "产物大小：$(du -sh playground/dist | cut -f1)"
